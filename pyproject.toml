[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling in LLMs via constrained decoding (Qwen3-0.6B)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ['\.venv/', 'llm_sdk/']